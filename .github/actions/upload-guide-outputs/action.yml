name: Upload guide outputs
description: >-
  Upload guide PDF/EPUB files that exist under tmp/, then fail if any expected
  output is missing. Partial uploads are kept when some builds failed.

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v6
      with:
        name: guide-outputs
        path: |
          tmp/guide-ja.pdf
          tmp/guide-en.pdf
          tmp/guide-ja.epub
          tmp/guide-en.epub
        if-no-files-found: warn
    - shell: bash
      run: |
        missing=0
        for f in tmp/guide-ja.pdf tmp/guide-en.pdf tmp/guide-ja.epub tmp/guide-en.epub; do
          if [ ! -f "$f" ]; then
            echo "::error title=Missing output::Expected file not found: $f"
            missing=1
          fi
        done
        ls -lh tmp/guide-*.{pdf,epub} 2>/dev/null || true
        exit "$missing"
