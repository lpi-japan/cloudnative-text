name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.set.outputs.docker }}
      manuscript: ${{ steps.set.outputs.manuscript }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.github/workflows/build-container.yaml'
            manuscript:
              - 'ja/**'
              - 'en/**'
              - 'config-common-pdf.yaml'
              - 'epub.css'
              - 'template.tex'
              - 'build-pdf.sh'
              - 'build-epub.sh'
              - '.github/workflows/build.yaml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "manuscript=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
            echo "manuscript=${{ steps.filter.outputs.manuscript }}" >> "$GITHUB_OUTPUT"
          fi

  build-container:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-container.yaml

  build-manuscript:
    needs: [changes, build-container]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.manuscript == 'true' &&
      (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: ja
            format: pdf
          - lang: ja
            format: epub
          - lang: en
            format: pdf
          - lang: en
            format: epub
    env:
      LC_ALL: C.UTF-8
    container:
      image: ${{ needs.build-container.outputs.image_ref || 'ghcr.io/lpi-japan/cloudnative-text:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build guide (${{ matrix.lang }} ${{ matrix.format }})
        run: |
          if [ "${{ matrix.format }}" = pdf ]; then
            ./build-pdf.sh "${{ matrix.lang }}"
          else
            ./build-epub.sh "${{ matrix.lang }}"
          fi
      - name: Upload guide-${{ matrix.lang }}.${{ matrix.format }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: tmp/guide-${{ matrix.lang }}.${{ matrix.format }}
          archive: false
          if-no-files-found: error
