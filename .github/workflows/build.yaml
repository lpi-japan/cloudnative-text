name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - make_pdf
      - feature/*
      - add_en

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.set.outputs.docker }}
      manuscript: ${{ steps.set.outputs.manuscript }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.github/workflows/build.yaml'
            manuscript:
              - 'ja/**'
              - 'en/**'
              - 'config-common-pdf.yaml'
              - 'epub.css'
              - 'template.tex'
              - 'build-pdf.sh'
              - 'build-epub.sh'
              - '.github/workflows/build.yaml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "manuscript=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=${{ steps.filter.outputs.docker }}" >> "$GITHUB_OUTPUT"
            echo "manuscript=${{ steps.filter.outputs.manuscript }}" >> "$GITHUB_OUTPUT"
          fi

  build-container:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        run: |
          echo "image=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          push: true
          # GHA cache (type=gha) は *.dockerbuild という Actions artifact が
          # 成果物一覧に出る。registry cache に切り替えて UI を汚さない。
          cache-from: type=registry,ref=ghcr.io/${{ steps.metadata.outputs.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.metadata.outputs.image }}:buildcache,mode=max
          tags: |
            ghcr.io/${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', steps.metadata.outputs.image) || '' }}
      - id: ref
        run: echo "image_ref=ghcr.io/${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}" >> "$GITHUB_OUTPUT"

  build-manuscript:
    needs: [changes, build-container]
    if: |
      always() && !cancelled() &&
      needs.changes.outputs.manuscript == 'true' &&
      (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      LC_ALL: C.UTF-8
    container:
      image: ${{ needs.build-container.outputs.image_ref || 'ghcr.io/lpi-japan/cloudnative-text:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build PDF (ja)
        id: build_pdf_ja
        continue-on-error: true
        run: PDF_BUILD_MODE=direct ./build-pdf.sh ja
      - name: Build PDF (en)
        id: build_pdf_en
        continue-on-error: true
        run: PDF_BUILD_MODE=direct ./build-pdf.sh en
      - name: Build EPUB (ja)
        id: build_epub_ja
        continue-on-error: true
        run: EPUB_BUILD_MODE=direct ./build-epub.sh ja
      - name: Build EPUB (en)
        id: build_epub_en
        continue-on-error: true
        run: EPUB_BUILD_MODE=direct ./build-epub.sh en
      - name: Stage guide outputs
        id: stage_outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact-staging
          for f in tmp/guide-ja.pdf tmp/guide-en.pdf tmp/guide-ja.epub tmp/guide-en.epub; do
            if [ -f "$f" ]; then
              cp "$f" artifact-staging/
            fi
          done
          echo "Staged files:"
          ls -la artifact-staging/
          count=$(find artifact-staging -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No guide outputs were built successfully." >&2
            exit 1
          fi
      - name: Upload guide outputs
        if: always() && steps.stage_outputs.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: guide-outputs
          path: artifact-staging/
          if-no-files-found: error
      - name: Report build failures
        if: always()
        run: |
          failed=0
          check() {
            if [ "$1" != "success" ]; then
              echo "::error title=Build failed::$2"
              failed=1
            fi
          }
          check "${{ steps.build_pdf_ja.outcome }}" "Build PDF (ja)"
          check "${{ steps.build_pdf_en.outcome }}" "Build PDF (en)"
          check "${{ steps.build_epub_ja.outcome }}" "Build EPUB (ja)"
          check "${{ steps.build_epub_en.outcome }}" "Build EPUB (en)"
          exit "$failed"
