<?xml version="1.0" encoding="UTF-8"?>
<!--
  図版 P-1　v6
  タイトル：前提の変化としての技術進化
  作成日：2026-06-08
  更新日：2026-06-18
  変更内容（v5→v6）：
    - 処理A/B/C を含むコンテンツ全体を+4px下にシフト（白カード内の上下余白を均等化）
    - State badge の width を 362→354 に調整（左右余白を均等化）
  キャンバス：1120 × 740 px（A4横相当）
  デザインガイド：左右比較テンプレート
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif">

  <!-- ===== DEFS ===== -->
  <defs>
    <marker id="arr-flow" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D84315"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══════════════════════════════════════
       TITLE BAR
  ═══════════════════════════════════════ -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="34" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#FFFFFF">図P-1　前提の変化としての技術進化</text>

  <!-- ═══════════════════════════════════════
       LEFT PANEL ─ モノリス（固定された前提）
  ═══════════════════════════════════════ -->
  <!-- ヘッダー -->
  <rect x="20" y="66" width="448" height="40" fill="#546E7A" rx="4"/>
  <text x="244" y="82" text-anchor="middle" font-size="10" fill="#CFD8DC">① モノリス</text>
  <text x="244" y="99" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#FFFFFF">固定された前提のもとで動作する</text>

  <!-- パネル本体 -->
  <rect x="20" y="106" width="448" height="534" fill="#E0F2F1" stroke="#546E7A"
        stroke-width="1.5" rx="0"/>

  <!-- ▼ 一体感境界枠（白背景・実線）─ コンテンツより先に描画 -->
  <rect x="54" y="150" width="370" height="240" fill="#FFFFFF" stroke="#00796B"
        stroke-width="2" rx="4"/>

  <!-- 状態バッジ（width 354 に調整して左右余白均等化） -->
  <rect x="62" y="166" width="354" height="40" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="4"/>
  <text x="239" y="181" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#00796B">状態（State）</text>
  <text x="239" y="197" text-anchor="middle" font-size="10" fill="#004D40">
    アプリ全体の状態を一元管理
  </text>

  <!-- 処理フロー（+4px）-->
  <text x="244" y="226" text-anchor="middle" font-size="10" fill="#546E7A">処理フロー</text>
  <!-- 処理A (+20px右シフト) -->
  <rect x="92" y="232" width="84" height="30" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="134" y="244" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#D84315">処理 A</text>
  <text x="134" y="256" text-anchor="middle" font-size="8" fill="#BF360C">受付</text>
  <line x1="178" y1="247" x2="194" y2="247" stroke="#D84315" stroke-width="1.5"
        marker-end="url(#arr-flow)"/>
  <!-- 処理B (+20px右シフト) -->
  <rect x="196" y="232" width="84" height="30" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="238" y="244" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#D84315">処理 B</text>
  <text x="238" y="256" text-anchor="middle" font-size="8" fill="#BF360C">計算</text>
  <line x1="282" y1="247" x2="298" y2="247" stroke="#D84315" stroke-width="1.5"
        marker-end="url(#arr-flow)"/>
  <!-- 処理C (+20px右シフト) -->
  <rect x="300" y="232" width="84" height="30" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="342" y="244" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#D84315">処理 C</text>
  <text x="342" y="256" text-anchor="middle" font-size="8" fill="#BF360C">出力</text>

  <!-- 通信（内部）バッジ（+4px）-->
  <rect x="62" y="280" width="354" height="38" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="239" y="294" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">通信（内部）</text>
  <text x="239" y="310" text-anchor="middle" font-size="10" fill="#1F4E79">
    同一プロセス内 ─ 関数呼び出し
  </text>

  <!-- データベース（+4px）-->
  <rect x="152" y="336" width="140" height="38" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5" rx="3"/>
  <text x="222" y="351" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#546E7A">データベース</text>
  <text x="222" y="365" text-anchor="middle" font-size="9" fill="#546E7A">状態を永続化・共有</text>

  <!-- ✓ 全体が一箇所で把握できる -->
  <rect x="52" y="444" width="374" height="44" fill="#E0F2F1" stroke="#00796B"
        stroke-width="2" rx="5"/>
  <text x="239" y="462" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#00796B">✓　全体が一箇所で把握できる</text>
  <text x="239" y="480" text-anchor="middle" font-size="10" fill="#004D40">
    状態・処理・通信 はすべてここにある
  </text>

  <!-- 注記 -->
  <text x="239" y="504" text-anchor="middle" font-size="10" fill="#546E7A">
    変更は例外として扱われる
  </text>
  <text x="239" y="520" text-anchor="middle" font-size="10" fill="#546E7A">
    環境は固定された前提のもとで動作する
  </text>

  <!-- ═══════════════════════════════════════
       CENTER PANEL ─ 前提の変化
  ═══════════════════════════════════════ -->
  <rect x="468" y="106" width="200" height="534" fill="#F5F7FA"/>

  <text x="568" y="182" text-anchor="middle" font-size="11" fill="#546E7A">モノリスを</text>
  <text x="568" y="200" text-anchor="middle" font-size="11" fill="#546E7A">分散化すると…</text>

  <polygon points="480,274 614,274 614,260 646,292 614,324 614,310 480,310"
           fill="#D84315" opacity="0.9"/>
  <text x="547" y="296" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">前提の変化</text>

  <rect x="478" y="332" width="180" height="78" fill="#FFEBEE" stroke="#C62828"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="352" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#C62828">変化・分散</text>
  <text x="568" y="370" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#C62828">不確実性が</text>
  <text x="568" y="392" text-anchor="middle" font-size="11" fill="#C62828">前提になった</text>

  <rect x="478" y="424" width="180" height="56" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="443" text-anchor="middle" font-size="10" fill="#2E75B6">静的最適化</text>
  <text x="568" y="461" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#2E75B6">→ 動的安定 へ</text>

  <line x1="468" y1="106" x2="468" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>
  <line x1="668" y1="106" x2="668" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════
       RIGHT PANEL ─ 分散システム
  ═══════════════════════════════════════ -->
  <rect x="668" y="66" width="432" height="40" fill="#2E75B6" rx="4"/>
  <text x="884" y="82" text-anchor="middle" font-size="10" fill="#BBDEFB">② 分散システム</text>
  <text x="884" y="99" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#FFFFFF">変化・分散・不確実性を前提として設計する</text>

  <rect x="668" y="106" width="432" height="534" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="0"/>

  <!-- Service A -->
  <rect x="688" y="120" width="392" height="82" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="700" y="148" text-anchor="start" font-size="11" font-weight="bold"
        fill="#1F4E79">Service A</text>
  <text x="700" y="163" text-anchor="start" font-size="9" fill="#546E7A">独立したサービス</text>
  <rect x="780" y="132" width="88" height="28" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="3"/>
  <text x="824" y="148" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#00796B">状態 A</text>
  <rect x="878" y="132" width="88" height="28" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="922" y="148" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#D84315">処理 A</text>
  <rect x="978" y="132" width="88" height="28" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <text x="1022" y="148" text-anchor="middle" font-size="9" fill="#546E7A">DB(A)</text>

  <line x1="884" y1="202" x2="884" y2="244" stroke="#D84315" stroke-width="2"
        marker-end="url(#arr-flow)"/>
  <rect x="896" y="212" width="92" height="20" fill="#FFEBEE" stroke="#D84315"
        stroke-width="1" rx="3"/>
  <text x="942" y="225" text-anchor="middle" font-size="9" fill="#C62828">外部呼び出し（通信）</text>

  <!-- Service B -->
  <rect x="688" y="248" width="392" height="82" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="700" y="276" text-anchor="start" font-size="11" font-weight="bold"
        fill="#1F4E79">Service B</text>
  <text x="700" y="291" text-anchor="start" font-size="9" fill="#546E7A">独立したサービス</text>
  <rect x="780" y="260" width="88" height="28" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="3"/>
  <text x="824" y="276" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#00796B">状態 B</text>
  <rect x="878" y="260" width="88" height="28" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="922" y="276" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#D84315">処理 B</text>
  <rect x="978" y="260" width="88" height="28" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <text x="1022" y="276" text-anchor="middle" font-size="9" fill="#546E7A">DB(B)</text>

  <line x1="884" y1="330" x2="884" y2="372" stroke="#D84315" stroke-width="2"
        marker-end="url(#arr-flow)"/>
  <rect x="896" y="340" width="92" height="20" fill="#FFEBEE" stroke="#D84315"
        stroke-width="1" rx="3"/>
  <text x="942" y="353" text-anchor="middle" font-size="9" fill="#C62828">外部呼び出し（通信）</text>

  <!-- Service C -->
  <rect x="688" y="376" width="392" height="82" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="700" y="404" text-anchor="start" font-size="11" font-weight="bold"
        fill="#1F4E79">Service C</text>
  <text x="700" y="419" text-anchor="start" font-size="9" fill="#546E7A">独立したサービス</text>
  <rect x="780" y="388" width="88" height="28" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="3"/>
  <text x="824" y="404" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#00796B">状態 C</text>
  <rect x="878" y="388" width="88" height="28" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="922" y="404" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#D84315">処理 C</text>
  <rect x="978" y="388" width="88" height="28" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <text x="1022" y="404" text-anchor="middle" font-size="9" fill="#546E7A">DB(C)</text>

  <!-- 分散まとめ -->
  <rect x="688" y="474" width="392" height="44" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="884" y="492" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#2E75B6">状態・処理・通信 が各サービスに分散した</text>
  <text x="884" y="510" text-anchor="middle" font-size="10" fill="#546E7A">
    各サービスは独立して動作する
  </text>

  <!-- ✗ 全体把握できない -->
  <rect x="688" y="528" width="392" height="44" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="2" rx="5"/>
  <text x="884" y="546" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#546E7A">✗　全体を一箇所から把握できない</text>
  <text x="884" y="564" text-anchor="middle" font-size="10" fill="#546E7A">
    変化・分散・不確実性が前提になった
  </text>

  <!-- ═══════════════════════════════════════
       CAPTION
  ═══════════════════════════════════════ -->
  <rect x="20" y="652" width="4" height="78" fill="#D84315" rx="2"/>
  <text x="34" y="668" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">前提の変化：</tspan>
    <tspan>モノリスでは、状態・処理・通信 はアプリケーション内に集約されており、全体を一箇所から把握できた。</tspan>
  </text>
  <text x="34" y="688" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan>分散システムでは、これらが複数の独立したサービスへ分散する。通信はすべて外部呼び出しとなり、</tspan>
    <tspan>状態も各サービスが個別に保持する。</tspan>
  </text>
  <text x="34" y="708" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">これは技術の進化ではなく、</tspan>
    <tspan>「固定された前提」から「変化・分散・不確実性を前提とした設計」への転換である。</tspan>
  </text>

</svg>
