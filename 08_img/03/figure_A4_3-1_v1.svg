<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cloud Native テキスト　図版 図3-1　v1
  A-4→図3-1 改訂：移動矢印削除・中央3要素ボックス追加・図番号更新
  v2改善点:
    ① 移動矢印を明示（通信/状態/依存関係がモノリス内部→マイクロサービス外部へ移動）
       - 通信: y=227の水平破線矢印（赤）
       - 状態: 3セグメント経路（赤 → 水平 y=292 → 下 = Service Bを回避）
       - 依存関係: y=487の水平破線矢印（ゴールド）
    ② Service間依存を4方向（A↔B, B↔C）に増やし複雑さを強調
    ③ キャプション: 12px・3行・左寄せ・左アクセントバー
  v1から変更なし: レイアウト全体・バッジ内容・ボックス定義・カラー
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     xml:lang="ja"
     font-family="'Meiryo','Yu Gothic','Hiragino Sans','MS Gothic',Arial,sans-serif">

  <title>図3-1 複雑さは消えない――置き場所が変わるだけ（v1）</title>
  <desc>Cloud Native テキスト 図版 図3-1 v1　中央補足ボックス・図番号更新</desc>

  <!-- ═══════════════════════════════════════
       DEFINITIONS
       ═══════════════════════════════════════ -->
  <defs>
    <!-- ① フロー矢頭（オレンジ）Service-to-service / auto-orient -->
    <marker id="arr-flow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#D84315"/>
    </marker>

    <!-- ② 移動矢頭 通信（赤） -->
    <marker id="arr-move-red" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#C62828"/>
    </marker>
    <!-- ③ 移動矢頭 状態（ティール） -->
    <marker id="arr-move-teal" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#00796B"/>
    </marker>
    <!-- ④ 移動矢頭 依存関係（ゴールド） -->
    <marker id="arr-move-gold" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#F57F17"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════
       0. ページ背景
       ═══════════════════════════════════════ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══════════════════════════════════════
       1. TITLE BAR
       ═══════════════════════════════════════ -->
  <g id="g-title">
    <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
    <text x="560" y="28" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="18" font-weight="bold" letter-spacing="0.5">
      図3-1　複雑さは消えない――置き場所が変わるだけ
    </text>
  </g>

  <!-- ═══════════════════════════════════════
       2. LEFT PANEL ── Before: モノリス
       ═══════════════════════════════════════ -->
  <g id="g-monolith-panel">

    <!-- パネルヘッダー（Infra Gray） -->
    <rect x="20" y="66" width="450" height="40" fill="#546E7A" rx="3"/>
    <text x="245" y="87" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="14" font-weight="bold">
      従来（モノリス）　Before
    </text>

    <!-- パネルボディ -->
    <rect x="20" y="106" width="450" height="564"
          fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>

    <!-- ─────────────────────────────────────
         アプリケーションボックス
         ───────────────────────────────────── -->
    <g id="g-monolith-app">
      <rect x="44" y="124" width="400" height="524"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="8"/>

      <text x="244" y="146" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="14" font-weight="bold">
        アプリケーション
      </text>

      <!-- 複雑さゾーン（破線ボックス） -->
      <rect x="128" y="188" width="232" height="338"
            fill="none" stroke="#2E75B6" stroke-width="1.2"
            stroke-dasharray="6,4" rx="6"/>
      <rect x="176" y="182" width="136" height="18" fill="#DDEEFF"/>
      <text x="244" y="191" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="10">複雑さの場所</text>

      <!-- ■ 通信バッジ（赤）内部 -->
      <g id="g-mono-comm">
        <rect x="140" y="200" width="208" height="54"
              fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="6"/>
        <text x="244" y="222" text-anchor="middle" dominant-baseline="middle"
              fill="#C62828" font-size="14" font-weight="bold">通信</text>
        <text x="244" y="241" text-anchor="middle" dominant-baseline="middle"
              fill="#C62828" font-size="10">失敗・遅延の可能性</text>
      </g>

      <!-- ■ 状態バッジ（ティール）内部 -->
      <g id="g-mono-state">
        <rect x="140" y="330" width="208" height="54"
              fill="#E0F2F1" stroke="#00796B" stroke-width="2" rx="6"/>
        <text x="244" y="352" text-anchor="middle" dominant-baseline="middle"
              fill="#00796B" font-size="14" font-weight="bold">状態</text>
        <text x="244" y="371" text-anchor="middle" dominant-baseline="middle"
              fill="#00796B" font-size="10">データの一貫性</text>
      </g>

      <!-- ■ 依存関係バッジ（ゴールド）内部 -->
      <g id="g-mono-dep">
        <rect x="140" y="460" width="208" height="54"
              fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="6"/>
        <text x="244" y="482" text-anchor="middle" dominant-baseline="middle"
              fill="#F57F17" font-size="14" font-weight="bold">依存関係</text>
        <text x="244" y="501" text-anchor="middle" dominant-baseline="middle"
              fill="#F57F17" font-size="10">変更の影響範囲</text>
      </g>

      <!-- 内部完結の注記 -->
      <text x="244" y="580" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="11" font-style="italic">
        すべて内部で完結している
      </text>

      <!-- 外部接続：シングルポイント -->
      <rect x="58" y="598" width="372" height="36"
            fill="none" stroke="#2E75B6" stroke-width="1"
            stroke-dasharray="3,3" rx="4"/>
      <text x="244" y="616" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="11">
        外部との接続 → 1 か所（シングルエントリーポイント）
      </text>

    </g><!-- /g-monolith-app -->
  </g><!-- /g-monolith-panel -->


  <!-- ═══════════════════════════════════════
       3. CENTER TRANSFORMATION
       ═══════════════════════════════════════ -->
  <g id="g-transform">

    <!-- 「分割」ラベル -->
    <text x="555" y="328" text-anchor="middle" dominant-baseline="middle"
          fill="#546E7A" font-size="14" font-weight="bold" letter-spacing="2">
      分　割
    </text>

    <!-- 太矢印ボディ -->
    <rect x="484" y="356" width="108" height="24" fill="#546E7A" rx="2"/>
    <!-- 太矢印ヘッド -->
    <polygon points="592,340  638,368  592,396" fill="#546E7A"/>

    <!-- ラベル下 -->
    <text x="555" y="414" text-anchor="middle" dominant-baseline="middle"
          fill="#D84315" font-size="13" font-weight="bold">
      複雑さは移動する
    </text>
    <text x="555" y="434" text-anchor="middle" dominant-baseline="middle"
          fill="#888888" font-size="10" font-style="italic">
      （総量は変わらない）
    </text>

  </g><!-- /g-transform -->

  <!-- ═══════════════════════════════════════
       3b. CENTER ── 複雑さ構成要素ボックス
           「複雑さは移動する」の下に 3 要素をまとめて提示
  ═══════════════════════════════════════ -->
  <g id="g-complexity-elements">
    <!-- 外枠（破線） -->
    <rect x="475" y="450" width="160" height="176"
          fill="#FFFFFF" stroke="#546E7A" stroke-width="1.2"
          stroke-dasharray="6,4" rx="6"/>
    <!-- ヘッダーラベル（「複雑さの 3 要素」） -->
    <rect x="502" y="443" width="106" height="15" fill="#F5F7FA"/>
    <text x="555" y="451" text-anchor="middle" dominant-baseline="middle"
          fill="#546E7A" font-size="9">複雑さの 3 要素</text>

    <!-- ■ 通信（赤） -->
    <rect x="483" y="460" width="144" height="46"
          fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="5"/>
    <text x="555" y="478" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="13" font-weight="bold">通信</text>
    <text x="555" y="497" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="9">失敗・遅延の可能性</text>

    <!-- ■ 状態（ティール） -->
    <rect x="483" y="514" width="144" height="46"
          fill="#E0F2F1" stroke="#00796B" stroke-width="2" rx="5"/>
    <text x="555" y="532" text-anchor="middle" dominant-baseline="middle"
          fill="#00796B" font-size="13" font-weight="bold">状態</text>
    <text x="555" y="551" text-anchor="middle" dominant-baseline="middle"
          fill="#00796B" font-size="9">データの一貫性</text>

    <!-- ■ 依存関係（ゴールド） -->
    <rect x="483" y="568" width="144" height="46"
          fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="555" y="586" text-anchor="middle" dominant-baseline="middle"
          fill="#F57F17" font-size="13" font-weight="bold">依存関係</text>
    <text x="555" y="605" text-anchor="middle" dominant-baseline="middle"
          fill="#F57F17" font-size="9">変更の影響範囲</text>
  </g><!-- /g-complexity-elements -->



  <!-- ═══════════════════════════════════════
       4. RIGHT PANEL ── After: マイクロサービス
       ═══════════════════════════════════════ -->
  <g id="g-ms-panel">

    <!-- パネルヘッダー（Component Blue） -->
    <rect x="650" y="66" width="450" height="40" fill="#2E75B6" rx="3"/>
    <text x="875" y="87" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="14" font-weight="bold">
      変化後（マイクロサービス）　After
    </text>

    <!-- パネルボディ -->
    <rect x="650" y="106" width="450" height="564"
          fill="#F5F7FA" stroke="#2E75B6" stroke-width="1.5"/>

    <!-- ─────────────────────────────────────
         サービスボックス（シンプル・複雑さは外）
         ───────────────────────────────────── -->
    <g id="g-services">
      <g id="g-service-a">
        <rect x="668" y="198" width="148" height="54"
              fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="8"/>
        <text x="742" y="225" text-anchor="middle" dominant-baseline="middle"
              fill="#1F4E79" font-size="13" font-weight="bold">Service A</text>
      </g>
      <g id="g-service-b">
        <rect x="668" y="328" width="148" height="54"
              fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="8"/>
        <text x="742" y="355" text-anchor="middle" dominant-baseline="middle"
              fill="#1F4E79" font-size="13" font-weight="bold">Service B</text>
      </g>
      <g id="g-service-c">
        <rect x="668" y="458" width="148" height="54"
              fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="8"/>
        <text x="742" y="485" text-anchor="middle" dominant-baseline="middle"
              fill="#1F4E79" font-size="13" font-weight="bold">Service C</text>
      </g>
    </g><!-- /g-services -->

    <!-- ─────────────────────────────────────
         [v2改善②] Service間矢印: 双方向（A↔B, B↔C）
         ───────────────────────────────────── -->
    <g id="g-svc-arrows">
      <!-- A → B（右側・下向き） -->
      <line x1="752" y1="252" x2="752" y2="326"
            stroke="#D84315" stroke-width="1.5"
            marker-end="url(#arr-flow)"/>
      <!-- B → A（左側・上向き） -->
      <line x1="730" y1="328" x2="730" y2="254"
            stroke="#D84315" stroke-width="1.5"
            marker-end="url(#arr-flow)"/>
      <!-- B → C（右側・下向き） -->
      <line x1="752" y1="382" x2="752" y2="456"
            stroke="#D84315" stroke-width="1.5"
            marker-end="url(#arr-flow)"/>
      <!-- C → B（左側・上向き） -->
      <line x1="730" y1="458" x2="730" y2="384"
            stroke="#D84315" stroke-width="1.5"
            marker-end="url(#arr-flow)"/>
    </g><!-- /g-svc-arrows -->

    <!-- ─────────────────────────────────────
         複雑さバッジ（サービスの外側に出現）
         ───────────────────────────────────── -->
    <g id="g-complexity-out">

      <!-- 複雑さゾーン（破線ボックス・赤枠）-->
      <rect x="832" y="188" width="252" height="340"
            fill="none" stroke="#C62828" stroke-width="1.2"
            stroke-dasharray="6,4" rx="6"/>
      <rect x="874" y="182" width="178" height="18" fill="#F5F7FA"/>
      <text x="963" y="191" text-anchor="middle" dominant-baseline="middle"
            fill="#C62828" font-size="10">複雑さの場所（移動後）</text>

      <!-- サービス→バッジ 接続（点線スタブ） -->
      <line x1="816" y1="225" x2="844" y2="225"
            stroke="#C62828" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="816" y1="355" x2="844" y2="355"
            stroke="#00796B" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="816" y1="485" x2="844" y2="485"
            stroke="#F57F17" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ■ 通信バッジ（赤）外部 -->
      <g id="g-ms-comm">
        <rect x="844" y="198" width="224" height="54"
              fill="#FFEBEE" stroke="#C62828" stroke-width="2.5" rx="6"/>
        <text x="956" y="220" text-anchor="middle" dominant-baseline="middle"
              fill="#C62828" font-size="14" font-weight="bold">通信</text>
        <text x="956" y="239" text-anchor="middle" dominant-baseline="middle"
              fill="#C62828" font-size="10">失敗・遅延が外に現れる</text>
      </g>

      <!-- ■ 状態バッジ（ティール）外部 -->
      <g id="g-ms-state">
        <rect x="844" y="328" width="224" height="54"
              fill="#E0F2F1" stroke="#00796B" stroke-width="2.5" rx="6"/>
        <text x="956" y="350" text-anchor="middle" dominant-baseline="middle"
              fill="#00796B" font-size="14" font-weight="bold">状態</text>
        <text x="956" y="369" text-anchor="middle" dominant-baseline="middle"
              fill="#00796B" font-size="10">不整合がサービス間で起きる</text>
      </g>

      <!-- ■ 依存関係バッジ（ゴールド）外部 -->
      <g id="g-ms-dep">
        <rect x="844" y="458" width="224" height="54"
              fill="#FFF9C4" stroke="#F57F17" stroke-width="2.5" rx="6"/>
        <text x="956" y="480" text-anchor="middle" dominant-baseline="middle"
              fill="#F57F17" font-size="14" font-weight="bold">依存関係</text>
        <text x="956" y="499" text-anchor="middle" dominant-baseline="middle"
              fill="#F57F17" font-size="10">変更の影響が外部に波及する</text>
      </g>

    </g><!-- /g-complexity-out -->

    <!-- 各サービスはシンプルという注記 -->
    <text x="742" y="578" text-anchor="middle" dominant-baseline="middle"
          fill="#546E7A" font-size="11" font-style="italic">
      各サービスはシンプル
    </text>

    <!-- 外部接続：マルチポイント -->
    <rect x="662" y="598" width="422" height="36"
          fill="none" stroke="#C62828" stroke-width="1"
          stroke-dasharray="3,3" rx="4"/>
    <text x="873" y="616" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="11">
      外部との接続 → 分散した複数の接続点
    </text>

  </g><!-- /g-ms-panel -->





  <!-- ═══════════════════════════════════════
       6. [v2改善③] CAPTION（12px・3行・左寄せ）
       ═══════════════════════════════════════ -->
  <g id="g-caption">
    <rect x="0" y="670" width="1120" height="70" fill="#ECEFF1"/>
    <!-- 上部ボーダーライン -->
    <line x1="0" y1="670" x2="1120" y2="670" stroke="#546E7A" stroke-width="2"/>
    <!-- 左アクセントバー（Component Blue） -->
    <rect x="0" y="670" width="6" height="70" fill="#2E75B6"/>

    <!-- 3行キャプション -->
    <text x="24" y="685" dominant-baseline="middle"
          fill="#1F4E79" font-size="12" font-weight="bold">
      ▶ アプリケーションを分割すると、通信・状態・依存関係が外部に現れる。
    </text>
    <text x="24" y="705" dominant-baseline="middle"
          fill="#222222" font-size="12">
      　分割は複雑さを減らすのではなく、その置き場所を変える行為である。
    </text>
    <text x="24" y="724" dominant-baseline="middle"
          fill="#222222" font-size="12">
      　どこに複雑さを置くかを意識することが、設計の判断になる。
    </text>
  </g>

</svg>
