<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cloud Native テキスト　図版 図3-1　v2
  v2 修正点：
    - 右パネル：Service A/B/C の各ボックス内に 通信・状態・依存関係 を分散配置
    - 右パネル：全サービスを薄い外枠（点線）で囲み「一つのシステム」として表現
    - 中央：「3要素ボックス」を削除、「一か所に集中 → 各サービスへ分散」メッセージに変更
    - キャプション：「外に現れる」→「各サービスへ分散して現れる」に変更
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     xml:lang="ja"
     font-family="'Meiryo','Yu Gothic','Hiragino Sans','MS Gothic',Arial,sans-serif">

  <title>図3-1 複雑さは消えない――置き場所が変わるだけ（v2）</title>
  <desc>Cloud Native テキスト 図版 図3-1 v2　各サービスへ複雑さ分散配置</desc>

  <!-- ═══ DEFINITIONS ═══ -->
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#D84315"/>
    </marker>
  </defs>

  <!-- ═══ 0. 背景 ═══ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══ 1. TITLE BAR ═══ -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="28" text-anchor="middle" dominant-baseline="middle"
        fill="#FFFFFF" font-size="18" font-weight="bold" letter-spacing="0.5">
    図3-1　複雑さは消えない――置き場所が変わるだけ
  </text>

  <!-- ═══════════════════════════════════════
       2. LEFT PANEL ── Before: モノリス
  ═══════════════════════════════════════ -->
  <rect x="20" y="66" width="450" height="40" fill="#546E7A" rx="3"/>
  <text x="245" y="87" text-anchor="middle" dominant-baseline="middle"
        fill="#FFFFFF" font-size="14" font-weight="bold">
    従来（モノリス）　Before
  </text>
  <rect x="20" y="106" width="450" height="564"
        fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>

  <!-- アプリケーションボックス -->
  <rect x="44" y="124" width="400" height="524"
        fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="8"/>
  <text x="244" y="146" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="14" font-weight="bold">アプリケーション</text>

  <!-- 複雑さゾーン（破線ボックス） -->
  <rect x="128" y="188" width="232" height="338"
        fill="none" stroke="#1F4E79" stroke-width="1.2"
        stroke-dasharray="6,4" rx="6"/>
  <rect x="156" y="182" width="176" height="18" fill="#DDEEFF"/>
  <text x="244" y="191" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="10" font-weight="bold">複雑さの場所（移動前）</text>

  <!-- 通信バッジ（赤）内部 -->
  <rect x="140" y="200" width="208" height="54"
        fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="6"/>
  <text x="244" y="222" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="14" font-weight="bold">通信</text>
  <text x="244" y="241" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="10">失敗・遅延の可能性</text>

  <!-- 状態バッジ（ティール）内部 -->
  <rect x="140" y="330" width="208" height="54"
        fill="#E0F2F1" stroke="#00796B" stroke-width="2" rx="6"/>
  <text x="244" y="352" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="14" font-weight="bold">状態</text>
  <text x="244" y="371" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="10">データの一貫性</text>

  <!-- 依存関係バッジ（ゴールド）内部 -->
  <rect x="140" y="460" width="208" height="54"
        fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="6"/>
  <text x="244" y="482" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="14" font-weight="bold">依存関係</text>
  <text x="244" y="501" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="10">変更の影響範囲</text>

  <!-- 内部完結の注記 -->
  <text x="244" y="580" text-anchor="middle" dominant-baseline="middle"
        fill="#546E7A" font-size="11" font-style="italic">すべて内部で完結している</text>

  <!-- 外部接続：シングルポイント -->
  <rect x="58" y="598" width="372" height="36"
        fill="none" stroke="#2E75B6" stroke-width="1"
        stroke-dasharray="3,3" rx="4"/>
  <text x="244" y="616" text-anchor="middle" dominant-baseline="middle"
        fill="#2E75B6" font-size="11">外部との接続 → 1 か所（シングルエントリーポイント）</text>

  <!-- ═══════════════════════════════════════
       3. CENTER ─ 分割矢印
  ═══════════════════════════════════════ -->
  <text x="555" y="298" text-anchor="middle" dominant-baseline="middle"
        fill="#546E7A" font-size="14" font-weight="bold" letter-spacing="2">分　割</text>
  <!-- 太矢印 -->
  <rect x="484" y="320" width="108" height="24" fill="#546E7A" rx="2"/>
  <polygon points="592,306 638,334 592,362" fill="#546E7A"/>

  <text x="555" y="384" text-anchor="middle" dominant-baseline="middle"
        fill="#D84315" font-size="13" font-weight="bold">複雑さは移動する</text>
  <text x="555" y="404" text-anchor="middle" dominant-baseline="middle"
        fill="#888888" font-size="10" font-style="italic">（総量は変わらない）</text>

  <!-- 「一か所→各サービスへ分散」説明ボックス -->
  <rect x="478" y="428" width="154" height="84"
        fill="#FFFFFF" stroke="#546E7A" stroke-width="1.2"
        stroke-dasharray="6,4" rx="6"/>
  <text x="555" y="449" text-anchor="middle" dominant-baseline="middle"
        fill="#546E7A" font-size="10" font-weight="bold">一か所に集中</text>
  <text x="555" y="468" text-anchor="middle" dominant-baseline="middle"
        fill="#888888" font-size="20">↓</text>
  <text x="555" y="495" text-anchor="middle" dominant-baseline="middle"
        fill="#2E75B6" font-size="10" font-weight="bold">各サービスへ分散</text>

  <!-- ═══════════════════════════════════════
       4. RIGHT PANEL ── After: マイクロサービス
  ═══════════════════════════════════════ -->
  <rect x="650" y="66" width="450" height="40" fill="#2E75B6" rx="3"/>
  <text x="875" y="87" text-anchor="middle" dominant-baseline="middle"
        fill="#FFFFFF" font-size="14" font-weight="bold">変化後（マイクロサービス）　After</text>
  <!-- パネルボディ -->
  <rect x="650" y="106" width="450" height="564"
        fill="#F5F7FA" stroke="#2E75B6" stroke-width="1.5"/>

  <!-- ── システム外枠（全サービスを一つのシステムとして囲む） ── -->
  <rect x="663" y="118" width="424" height="550"
        fill="none" stroke="#1F4E79" stroke-width="1.8"
        stroke-dasharray="8,4" rx="8"/>
  <!-- ラベルタグ（外枠の上辺を上書き） -->
  <rect x="815" y="111" width="120" height="16" fill="#F5F7FA"/>
  <text x="875" y="119" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="10" font-weight="bold">複雑さの場所（移動後）</text>

  <!-- ══ Service A (y=130, h=162) ══ -->
  <rect x="675" y="130" width="400" height="162"
        fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="8"/>
  <text x="875" y="146" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="13" font-weight="bold">Service A</text>
  <line x1="687" y1="158" x2="1063" y2="158"
        stroke="#2E75B6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 通信 -->
  <rect x="687" y="162" width="376" height="32"
        fill="#FFEBEE" stroke="#C62828" stroke-width="1.5" rx="4"/>
  <text x="875" y="174" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="11" font-weight="bold">通信</text>
  <text x="875" y="187" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="9">失敗・遅延の可能性</text>
  <!-- 状態 -->
  <rect x="687" y="198" width="376" height="32"
        fill="#E0F2F1" stroke="#00796B" stroke-width="1.5" rx="4"/>
  <text x="875" y="210" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="11" font-weight="bold">状態</text>
  <text x="875" y="223" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="9">データの一貫性</text>
  <!-- 依存関係 -->
  <rect x="687" y="234" width="376" height="32"
        fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5" rx="4"/>
  <text x="875" y="246" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="11" font-weight="bold">依存関係</text>
  <text x="875" y="259" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="9">変更の影響範囲</text>

  <!-- A ⇄ B 連携矢印（ギャップ y=292–312） -->
  <line x1="857" y1="294" x2="857" y2="310"
        stroke="#D84315" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <line x1="893" y1="310" x2="893" y2="294"
        stroke="#D84315" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <text x="875" y="302" text-anchor="middle" dominant-baseline="middle"
        fill="#546E7A" font-size="8">API</text>

  <!-- ══ Service B (y=312, h=162) ══ -->
  <rect x="675" y="312" width="400" height="162"
        fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="8"/>
  <text x="875" y="328" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="13" font-weight="bold">Service B</text>
  <line x1="687" y1="340" x2="1063" y2="340"
        stroke="#2E75B6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 通信 -->
  <rect x="687" y="344" width="376" height="32"
        fill="#FFEBEE" stroke="#C62828" stroke-width="1.5" rx="4"/>
  <text x="875" y="356" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="11" font-weight="bold">通信</text>
  <text x="875" y="369" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="9">失敗・遅延の可能性</text>
  <!-- 状態 -->
  <rect x="687" y="380" width="376" height="32"
        fill="#E0F2F1" stroke="#00796B" stroke-width="1.5" rx="4"/>
  <text x="875" y="392" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="11" font-weight="bold">状態</text>
  <text x="875" y="405" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="9">データの一貫性</text>
  <!-- 依存関係 -->
  <rect x="687" y="416" width="376" height="32"
        fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5" rx="4"/>
  <text x="875" y="428" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="11" font-weight="bold">依存関係</text>
  <text x="875" y="441" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="9">変更の影響範囲</text>

  <!-- B ⇄ C 連携矢印（ギャップ y=474–494） -->
  <line x1="857" y1="476" x2="857" y2="492"
        stroke="#D84315" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <line x1="893" y1="492" x2="893" y2="476"
        stroke="#D84315" stroke-width="1.5" marker-end="url(#arr-flow)"/>
  <text x="875" y="484" text-anchor="middle" dominant-baseline="middle"
        fill="#546E7A" font-size="8">API</text>

  <!-- ══ Service C (y=494, h=162) ══ -->
  <rect x="675" y="494" width="400" height="162"
        fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="8"/>
  <text x="875" y="510" text-anchor="middle" dominant-baseline="middle"
        fill="#1F4E79" font-size="13" font-weight="bold">Service C</text>
  <line x1="687" y1="522" x2="1063" y2="522"
        stroke="#2E75B6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- 通信 -->
  <rect x="687" y="526" width="376" height="32"
        fill="#FFEBEE" stroke="#C62828" stroke-width="1.5" rx="4"/>
  <text x="875" y="538" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="11" font-weight="bold">通信</text>
  <text x="875" y="551" text-anchor="middle" dominant-baseline="middle"
        fill="#C62828" font-size="9">失敗・遅延の可能性</text>
  <!-- 状態 -->
  <rect x="687" y="562" width="376" height="32"
        fill="#E0F2F1" stroke="#00796B" stroke-width="1.5" rx="4"/>
  <text x="875" y="574" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="11" font-weight="bold">状態</text>
  <text x="875" y="587" text-anchor="middle" dominant-baseline="middle"
        fill="#00796B" font-size="9">データの一貫性</text>
  <!-- 依存関係 -->
  <rect x="687" y="598" width="376" height="32"
        fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5" rx="4"/>
  <text x="875" y="610" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="11" font-weight="bold">依存関係</text>
  <text x="875" y="623" text-anchor="middle" dominant-baseline="middle"
        fill="#F57F17" font-size="9">変更の影響範囲</text>

  <!-- ═══ 5. CAPTION ═══ -->
  <rect x="0" y="670" width="1120" height="70" fill="#ECEFF1"/>
  <line x1="0" y1="670" x2="1120" y2="670" stroke="#546E7A" stroke-width="2"/>
  <rect x="0" y="670" width="6" height="70" fill="#2E75B6"/>

  <text x="24" y="686" dominant-baseline="middle"
        fill="#1F4E79" font-size="12" font-weight="bold">
    ▶ 分割しても複雑さは消えない。通信・状態・依存関係は各サービスへ分散して現れる。
  </text>
  <text x="24" y="706" dominant-baseline="middle"
        fill="#222222" font-size="12">
    　モノリス内部にまとまっていた複雑さが、複数のサービスへ分散するだけである。
  </text>
  <text x="24" y="726" dominant-baseline="middle"
        fill="#222222" font-size="12">
    　どこに複雑さを置くかを意識することが、設計の判断になる。
  </text>

</svg>
