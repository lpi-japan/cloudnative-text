<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cloud Native テキスト　図版 図4-1　v1
  A-6→図4-1 改訂：図番号更新・重複説明削除・処理A/B/C中央寄せ・中央矢印テキスト整理・?削除
  タイトル：分散した瞬間に全体が見えなくなる理由
  主張：モノリスでは状態・ログ・処理が一箇所に集約されていた。
        分散システムでは各サービスに散在し、全体像が見えなくなる。
        Observability / Distributed Tracing がそのために必要となる。
  A-4・A-5との連続性：
    A-4「複雑さの移動」→ A-5「通信制御の移動」→ A-6「可視性の喪失」
  グループ構造:
    g-title
    g-left-panel          左パネル（モノリス：全体が見える）
      g-app-box           アプリケーションボックス
      g-mono-state        状態バッジ
      g-mono-log          ログバッジ
      g-mono-proc         処理フロー（A→B→C）
      g-mono-db           データベース
      g-mono-bracket      一括管理ダッシュ枠
      g-mono-visible      可視性インジケータ
      g-mono-note
    g-center              中央変換ゾーン
    g-right-panel         右パネル（分散システム：全体が見えない）
      g-right-bracket     全体像ゾーンダッシュ枠
      g-svc-a / g-svc-b / g-svc-c   各サービス
      g-q-ab / g-q-bc     不確実性（?マーク・矢印）
      g-right-warn        警告ボックス
      g-observability-note
      g-right-note
    g-caption
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     xml:lang="ja"
     font-family="'Meiryo','Yu Gothic','Hiragino Sans','MS Gothic',Arial,sans-serif">

  <title>図4-1 分散した瞬間、全体が見えなくなる</title>
  <desc>Cloud Native テキスト 図版 図4-1 v1　分散した瞬間、全体が見えなくなる</desc>

  <defs>
    <!-- フロー矢頭（オレンジ）処理フロー・サービス間フロー -->
    <marker id="arr-flow" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#D84315"/>
    </marker>
    <!-- ブルー矢頭（DB接続など） -->
    <marker id="arr-blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#2E75B6"/>
    </marker>
    <!-- グレー矢頭（補助線） -->
    <marker id="arr-gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8"
            refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- ═══════════════ 0. 背景 ══════════════════════════ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══════════════ 1. TITLE BAR ════════════════════ -->
  <g id="g-title">
    <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
    <text x="560" y="26" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="18" font-weight="bold" letter-spacing="0.5">
      図4-1　分散した瞬間、全体が見えなくなる
    </text>

  </g>

  <!-- ═══════════════ 2. LEFT PANEL（モノリス：全体が見える） ════
       State Teal ヘッダー：可視性が「ある」状態を示す積極色
       ════════════════════════════════════════════════════════ -->
  <g id="g-left-panel">

    <!-- パネルヘッダー -->
    <rect x="20" y="66" width="448" height="40" fill="#00796B" rx="2"/>
    <text x="244" y="87" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="14" font-weight="bold">
      ① モノリス ─ 全体が一箇所に集約
    </text>

    <!-- パネルボディ -->
    <rect x="20" y="106" width="448" height="534"
          fill="#E0F2F1" stroke="#00796B" stroke-width="1.5"/>

    <!-- ─── アプリケーションボックス ─────────────────── -->
    <g id="g-app-box">
      <rect x="42" y="126" width="404" height="330"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="2" rx="4"/>
      <text x="244" y="144" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="13" font-weight="bold">
        アプリケーション（モノリス）
      </text>
      <line x1="42" y1="156" x2="446" y2="156" stroke="#2E75B6" stroke-width="0.8"/>
    </g>

    <!-- ─── 状態・ログバッジ ─────────────────────────── -->
    <g id="g-mono-state">
      <rect x="62" y="168" width="168" height="40"
            fill="#E0F2F1" stroke="#00796B" stroke-width="1.5" rx="3"/>
      <text x="146" y="182" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="11" font-weight="bold">状態（State）</text>
      <text x="146" y="198" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="9">一元管理</text>
    </g>
    <g id="g-mono-log">
      <rect x="250" y="168" width="168" height="40"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="3"/>
      <text x="334" y="182" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="11" font-weight="bold">ログ（Log）</text>
      <text x="334" y="198" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="9">集中管理</text>
    </g>

    <!-- ─── 処理フロー A→B→C ────────────────────────── -->
    <g id="g-mono-proc">
      <text x="244" y="232" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="10">─── 処理フロー ───</text>

      <rect x="82" y="242" width="82" height="34"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1.5" rx="3"/>
      <text x="123" y="259" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="12" font-weight="bold">処理 A</text>

      <line x1="168" y1="259" x2="188" y2="259"
            stroke="#D84315" stroke-width="2" marker-end="url(#arr-flow)"/>

      <rect x="192" y="242" width="82" height="34"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1.5" rx="3"/>
      <text x="233" y="259" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="12" font-weight="bold">処理 B</text>

      <line x1="278" y1="259" x2="298" y2="259"
            stroke="#D84315" stroke-width="2" marker-end="url(#arr-flow)"/>

      <rect x="302" y="242" width="82" height="34"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1.5" rx="3"/>
      <text x="343" y="259" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="12" font-weight="bold">処理 C</text>
    </g>

    <!-- ─── データベース（共有・一元） ──────────────────── -->
    <g id="g-mono-db">
      <!-- 処理→DB 接続線 -->
      <line x1="123" y1="276" x2="123" y2="298" stroke="#546E7A" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="233" y1="276" x2="233" y2="298" stroke="#546E7A" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="343" y1="276" x2="343" y2="298" stroke="#546E7A" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="123" y1="298" x2="343" y2="298" stroke="#546E7A" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="233" y1="298" x2="233" y2="316" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="3,2"
            marker-end="url(#arr-gray)"/>

      <rect x="137" y="316" width="192" height="38"
            fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" rx="3"/>
      <text x="233" y="330" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="11" font-weight="bold">データベース</text>
      <text x="233" y="344" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">（共有・一元管理）</text>
    </g>

    <!-- ─── 一括管理ダッシュ枠 ──────────────────────── -->
    <g id="g-mono-bracket">
      <rect x="52" y="160" width="372" height="200"
            fill="none" stroke="#00796B" stroke-width="1"
            stroke-dasharray="5,3" rx="5"/>

    </g>

    <!-- ─── 可視性インジケータ（成功） ──────────────────── -->
    <g id="g-mono-visible">
      <rect x="52" y="476" width="372" height="50"
            fill="#E0F2F1" stroke="#00796B" stroke-width="2" rx="4"/>
      <text x="238" y="494" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="14" font-weight="bold">✓ 全体が見える</text>
      <text x="238" y="514" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="10">状態・ログ・処理フローをまとめて確認できる</text>
    </g>

    <!-- ─── 左パネル下部ノート ──────────────────────── -->
    <g id="g-mono-note">
      <text x="244" y="546" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="11">
        障害が起きても「どこで何が起きたか」がすぐ分かる
      </text>
    </g>

  </g><!-- /g-left-panel -->


  <!-- ═══════════════ 3. CENTER（変換ゾーン） ══════════════
       A-4スタイルの太矢印 + 警告ボックスで「可視性の喪失」を表現
       ════════════════════════════════════════════════════ -->
  <g id="g-center">

    <!-- センターゾーン背景 -->
    <rect x="468" y="106" width="200" height="534" fill="#F5F7FA"/>



    <!-- 変換矢印（太矢印・オレンジ） -->
    <polygon points="480,284 616,284 616,270 648,302 616,334 616,320 480,320"
             fill="#D84315"/>
    <text x="548" y="303" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="11" font-weight="bold">モノリスを分散化</text>

    <!-- 警告ボックス「全体が見えなくなる」 -->
    <rect x="480" y="348" width="176" height="72"
          fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="4"/>
    <text x="568" y="370" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="14" font-weight="bold">全体が</text>
    <text x="568" y="390" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="14" font-weight="bold">見えなくなる</text>
    <text x="568" y="408" text-anchor="middle" dominant-baseline="middle"
          fill="#C62828" font-size="9" font-style="italic">可視性の喪失</text>

    <!-- 解決策へのリンク -->
    <line x1="568" y1="422" x2="568" y2="452"
          stroke="#2E75B6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="562,452 574,452 568,462" fill="#2E75B6"/>
    <text x="568" y="476" text-anchor="middle" dominant-baseline="middle"
          fill="#2E75B6" font-size="11" font-weight="bold">Observability</text>
    <text x="568" y="492" text-anchor="middle" dominant-baseline="middle"
          fill="#2E75B6" font-size="11" font-weight="bold">で解決</text>

  </g><!-- /g-center -->


  <!-- ═══════════════ 4. RIGHT PANEL（分散システム：全体が見えない） ════
       Error Red ヘッダー：可視性が「ない」状態を警告色で示す
       ════════════════════════════════════════════════════════════════ -->
  <g id="g-right-panel">

    <!-- パネルヘッダー -->
    <rect x="668" y="66" width="432" height="40" fill="#C62828" rx="2"/>
    <text x="884" y="87" text-anchor="middle" dominant-baseline="middle"
          fill="#FFFFFF" font-size="14" font-weight="bold">
      ② 分散システム ─ 全体像が把握できない
    </text>

    <!-- パネルボディ -->
    <rect x="668" y="106" width="432" height="534"
          fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>

    <!-- ─── 全体像ゾーン（大ダッシュ枠） ───────────────── -->
    <g id="g-right-bracket">
      <rect x="682" y="120" width="404" height="316"
            fill="none" stroke="#C62828" stroke-width="1.5"
            stroke-dasharray="6,4" rx="6"/>

    </g>

    <!-- ─── Service A ─────────────────────────────── -->
    <g id="g-svc-a">
      <rect x="690" y="130" width="386" height="84"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="3"/>
      <text x="728" y="160" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="12" font-weight="bold">Service A</text>
      <text x="728" y="176" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">（独立）</text>

      <!-- 各サービス独自の状態・ログ・処理バッジ -->
      <rect x="766" y="142" width="82" height="28"
            fill="#E0F2F1" stroke="#00796B" stroke-width="1" rx="2"/>
      <text x="807" y="156" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="9" font-weight="bold">状態 A</text>

      <rect x="860" y="142" width="82" height="28"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1" rx="2"/>
      <text x="901" y="156" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="9" font-weight="bold">ログ A</text>

      <rect x="954" y="142" width="82" height="28"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1" rx="2"/>
      <text x="995" y="156" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="9" font-weight="bold">処理 A</text>

      <!-- Service独自DB（ミニ） -->
      <rect x="840" y="182" width="88" height="22"
            fill="#ECEFF1" stroke="#546E7A" stroke-width="0.8" rx="2"/>
      <text x="884" y="193" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">DB (A)</text>
    </g>

    <!-- ─── A→B 間の矢印と疑問符 ──────────────────── -->
    <g id="g-q-ab">
      <!-- リクエスト矢印 -->
      <line x1="854" y1="214" x2="854" y2="236"
            stroke="#D84315" stroke-width="1.5" stroke-dasharray="4,2"
            marker-end="url(#arr-flow)"/>

    </g>

    <!-- ─── Service B ─────────────────────────────── -->
    <g id="g-svc-b">
      <rect x="690" y="238" width="386" height="84"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="3"/>
      <text x="728" y="268" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="12" font-weight="bold">Service B</text>
      <text x="728" y="284" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">（独立）</text>

      <rect x="766" y="250" width="82" height="28"
            fill="#E0F2F1" stroke="#00796B" stroke-width="1" rx="2"/>
      <text x="807" y="264" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="9" font-weight="bold">状態 B</text>

      <rect x="860" y="250" width="82" height="28"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1" rx="2"/>
      <text x="901" y="264" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="9" font-weight="bold">ログ B</text>

      <rect x="954" y="250" width="82" height="28"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1" rx="2"/>
      <text x="995" y="264" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="9" font-weight="bold">処理 B</text>

      <rect x="840" y="290" width="88" height="22"
            fill="#ECEFF1" stroke="#546E7A" stroke-width="0.8" rx="2"/>
      <text x="884" y="301" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">DB (B)</text>
    </g>

    <!-- ─── B→C 間の矢印と疑問符 ──────────────────── -->
    <g id="g-q-bc">
      <line x1="854" y1="322" x2="854" y2="344"
            stroke="#D84315" stroke-width="1.5" stroke-dasharray="4,2"
            marker-end="url(#arr-flow)"/>

    </g>

    <!-- ─── Service C ─────────────────────────────── -->
    <g id="g-svc-c">
      <rect x="690" y="346" width="386" height="84"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="3"/>
      <text x="728" y="376" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="12" font-weight="bold">Service C</text>
      <text x="728" y="392" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">（独立）</text>

      <rect x="766" y="358" width="82" height="28"
            fill="#E0F2F1" stroke="#00796B" stroke-width="1" rx="2"/>
      <text x="807" y="372" text-anchor="middle" dominant-baseline="middle"
            fill="#00796B" font-size="9" font-weight="bold">状態 C</text>

      <rect x="860" y="358" width="82" height="28"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1" rx="2"/>
      <text x="901" y="372" text-anchor="middle" dominant-baseline="middle"
            fill="#2E75B6" font-size="9" font-weight="bold">ログ C</text>

      <rect x="954" y="358" width="82" height="28"
            fill="#FFF3E0" stroke="#D84315" stroke-width="1" rx="2"/>
      <text x="995" y="372" text-anchor="middle" dominant-baseline="middle"
            fill="#D84315" font-size="9" font-weight="bold">処理 C</text>

      <rect x="840" y="398" width="88" height="22"
            fill="#ECEFF1" stroke="#546E7A" stroke-width="0.8" rx="2"/>
      <text x="884" y="409" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">DB (C)</text>
    </g>

    <!-- ─── 可視性喪失インジケータ（警告） ────────────── -->
    <g id="g-right-warn">
      <rect x="690" y="454" width="386" height="46"
            fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="4"/>
      <text x="883" y="471" text-anchor="middle" dominant-baseline="middle"
            fill="#C62828" font-size="13" font-weight="bold">✗ 全体像が把握できない</text>
      <text x="883" y="489" text-anchor="middle" dominant-baseline="middle"
            fill="#C62828" font-size="10">どのサービスで何が起きているか分からない</text>
    </g>

    <!-- ─── Observability 解決策ノート ───────────────── -->
    <g id="g-observability-note">
      <rect x="690" y="514" width="386" height="56"
            fill="#DDEEFF" stroke="#2E75B6" stroke-width="1.5" rx="4"/>
      <text x="883" y="531" text-anchor="middle" dominant-baseline="middle"
            fill="#1F4E79" font-size="12" font-weight="bold">→ Observability / Distributed Tracing が必要</text>
      <text x="883" y="549" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="10">メトリクス・ログ・トレーシングで「全体」を再構築する</text>
      <text x="883" y="562" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="9">（Prometheus / Grafana / Jaeger / Zipkin など）</text>
    </g>

    <!-- ─── 右パネル下部ノート ──────────────────────── -->
    <g id="g-right-note">
      <text x="883" y="590" text-anchor="middle" dominant-baseline="middle"
            fill="#546E7A" font-size="11">
        分散化によって生じた「見えない」問題を、観測によって解決する
      </text>
    </g>

  </g><!-- /g-right-panel -->


  <!-- ═══════════════ 5. CAPTION ════════════════════════ -->
  <g id="g-caption">
    <rect x="20" y="652" width="4" height="74" fill="#1F4E79"/>
    <text x="32" y="667" dominant-baseline="middle"
          fill="#546E7A" font-size="12">
      図4-1：モノリスでは状態・ログ・処理フローが一箇所に集約され、何が起きているかを一目で把握できる。
    </text>
    <text x="32" y="687" dominant-baseline="middle"
          fill="#546E7A" font-size="12">
      分散システムでは、これらの情報が各サービスに独立して分散するため、全体像を直接確認することが困難になる。
    </text>
    <text x="32" y="707" dominant-baseline="middle"
          fill="#546E7A" font-size="12">
      この「可視性の喪失」を補うために、Observability（可観測性）と Distributed Tracing の仕組みが必要となる（第4部で詳述）。
    </text>
  </g>

</svg>
