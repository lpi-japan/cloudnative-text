<!-- ═══════════════════════════════════════════════════
     CAPTION
════════════════════════════════════════════════════ -->
<rect x="0" y="648" width="1120" height="92" fill="#ECEFF1"/>
<rect x="20" y="658" width="4" height="66" rx="2" ry="2" fill="#546E7A"/>
<text x="34" y="672" font-family="sans-serif" font-size="11" fill="#37474F">
  【図の説明】モノリスでは、ログとメトリクスはアプリケーション内の一か所に集約されており、問題発生時も単一の
</text>
<text x="34" y="688" font-family="sans-serif" font-size="11" fill="#37474F">
  場所を調べればよい。一方、マイクロサービスでは、各サービス（A〜F）が独立してログ・メトリクスを出力し、
</text>
<text x="34" y="704" font-family="sans-serif" font-size="11" fill="#37474F">
  さらにサービス間の通信経路（A→B, A→D, B→C, B→E, C→F, D→E, E→F）が複数存在するため、
</text>
<text x="34" y="720" font-family="sans-serif" font-size="11" fill="#37474F">
  障害箇所の特定や全体の状態把握が著しく困難になる。これが、オブザーバビリティが必要とされる背景である。
</text>

</svg>
