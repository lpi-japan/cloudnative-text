# PDF ビルド共通設定（ja/en 共通）。言語固有は各言語ディレクトリの config-pdf.yaml。
filters:
  - pandoc-crossref

variables:
  documentclass: ltjarticle
  documentClass: ltjarticle
  mainfont: Harano Aji Gothic
  bookVersion: 0.1.0
  block-headings: true

toc: true
toc-depth: 3
highlight-style: tango
include-in-header:
  - listing.tex
number-sections: true
listings: true
pdf-engine: lualatex
