<?xml version="1.0" encoding="UTF-8"?>
<!--
  図版 1-1　v3
  タイトル：Change in Execution Unit:VMからContainerへ
  作成日：2026-06-08
  更新日：2026-06-18
  変更内容（v2→v3）：
    - 左側点線枠内に「Virtual Machine (VM)」ヘッダー帯を追加（右「Container」と対称化）
    - アプリ/Libraries/Runtime層を+22px下シフト、ゲストOS高さを調整
    - 右側「必要なLibraries・依存関係」→「Libraries + Runtime」に改名
  キャンバス：1120 × 740 px（A4横相当）
  デザインガイド：左右比較テンプレート（積層アーキテクチャ版）
  左：VM（OS全体を含む大きな実行単位）
  右：Container（最小構成の小さな実行単位）
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif">

  <!-- ===== DEFS ===== -->
  <defs>
    <marker id="arr-flow" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D84315"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B0BEC5"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══════════════════════════════════════
       TITLE BAR
  ═══════════════════════════════════════ -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="34" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#FFFFFF">Figure 1-1: The Change in Execution Unit — From VM to Container</text>

  <!-- ═══════════════════════════════════════
       LEFT PANEL ─ Virtual Machine (VM)
  ═══════════════════════════════════════ -->
  <!-- ヘッダー -->
  <rect x="20" y="66" width="448" height="40" fill="#546E7A" rx="4"/>
  <text x="244" y="82" text-anchor="middle" font-size="10" fill="#CFD8DC">
    ① Virtual Machine (VM)
  </text>
  <text x="244" y="99" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#FFFFFF">Execution Unit = Environment Including the Entire OS</text>

  <!-- パネル本体 -->
  <rect x="20" y="106" width="448" height="534" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5"/>

  <!-- ─── 実行単位 点線ボックス（大きい） ─── -->
  <rect x="44" y="122" width="400" height="385" fill="none" stroke="#D84315"
        stroke-width="2" stroke-dasharray="7,4" rx="5"/>

  <!-- 実行単位バッジ（オレンジ） -->
  <rect x="84" y="126" width="320" height="22" fill="#D84315" rx="11"/>
  <text x="244" y="141" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#FFFFFF">Execution Unit = Entire Environment Including OS (this is one unit)</text>

  <!-- ▼ Virtual Machine (VM)フレーム（Containerフレームと対称） -->
  <rect x="54" y="154" width="380" height="344" fill="#F5F7FA" stroke="#546E7A"
        stroke-width="1.5" rx="4"/>
  <!-- VM ヘッダー帯 -->
  <rect x="54" y="154" width="380" height="22" fill="#546E7A" rx="4"/>
  <text x="244" y="170" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">Virtual Machine (VM)</text>

  <!-- ── Application層（+22px） ── -->
  <rect x="64" y="182" width="360" height="48" fill="#E0F2F1" stroke="#00796B"
        stroke-width="2" rx="4"/>
  <text x="244" y="201" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#00796B">Application</text>
  <text x="244" y="219" text-anchor="middle" font-size="9" fill="#004D40">
    Business Logic / Execution Code
  </text>

  <!-- ── Libraries層（+22px） ── -->
  <rect x="64" y="236" width="360" height="44" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="244" y="254" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Libraries</text>
  <text x="244" y="271" text-anchor="middle" font-size="9" fill="#BF360C">
    Dependency Packages / Modules
  </text>

  <!-- ── Runtime層（+22px） ── -->
  <rect x="64" y="286" width="360" height="44" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="244" y="304" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Runtime</text>
  <text x="244" y="321" text-anchor="middle" font-size="9" fill="#BF360C">
    Execution Engine (JVM / Node.js, etc.)
  </text>

  <!-- ── ゲストOS層（y=330, h=166） ── -->
  <rect x="64" y="336" width="360" height="154" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="2" rx="4"/>
  <!-- ゲストOS ヘッダー帯 -->
  <rect x="64" y="336" width="360" height="22" fill="#2E75B6" rx="4"/>
  <text x="244" y="352" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">Guest OS (Independent, Complete OS Environment)</text>
  <!-- 内容ラベル -->
  <text x="244" y="380" text-anchor="middle" font-size="10" fill="#1F4E79">
    Kernel / OS Services / Process Management
  </text>
  <text x="244" y="398" text-anchor="middle" font-size="10" fill="#1F4E79">
    File System / Network Stack
  </text>
  <text x="244" y="416" text-anchor="middle" font-size="10" fill="#1F4E79">
    Mediates between Hardware and Application Layer
  </text>
  <!-- サイズ注記 -->
  <rect x="74" y="430" width="332" height="48" fill="#FFEBEE" stroke="#C62828"
        stroke-width="1" rx="3"/>
  <text x="244" y="449" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#C62828">Boot: Tens of seconds to minutes / Size: Several GB (includes entire OS)</text>
  <text x="244" y="468" text-anchor="middle" font-size="9" fill="#C62828">
    Heavy because Guest OS is included in the execution unit
  </text>

  <!-- ── Hypervisor層 ── -->
  <rect x="44" y="512" width="400" height="50" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="244" y="531" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Hypervisor</text>
  <text x="244" y="549" text-anchor="middle" font-size="9" fill="#BF360C">
    Virtualizes and manages multiple Guest OSes on physical hardware
  </text>

  <!-- ── Physical Server層 ── -->
  <rect x="44" y="568" width="400" height="52" fill="#546E7A" rx="4"/>
  <text x="244" y="590" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">Physical Server</text>
  <text x="244" y="608" text-anchor="middle" font-size="9" fill="#CFD8DC">
    CPU / Memory / Storage
  </text>

  <!-- ═══════════════════════════════════════
       CENTER PANEL ─ Change in Execution Unit
  ═══════════════════════════════════════ -->
  <rect x="468" y="106" width="200" height="534" fill="#F5F7FA"/>

  <text x="568" y="180" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#546E7A">Change in Execution Unit</text>

  <rect x="478" y="190" width="180" height="44" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="207" text-anchor="middle" font-size="9" fill="#D84315">
    VM Execution Unit
  </text>
  <text x="568" y="225" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Entire Environment Including OS</text>

  <line x1="568" y1="236" x2="568" y2="258" stroke="#546E7A" stroke-width="1.5"
        marker-end="url(#arr-gray)"/>
  <text x="568" y="254" text-anchor="middle" font-size="9" font-weight="bold" fill="#1F4E79">
    The unit changes
  </text>

  <rect x="478" y="264" width="180" height="44" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="281" text-anchor="middle" font-size="9" fill="#00796B">
    Container Execution Unit
  </text>
  <text x="568" y="299" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#00796B">Minimum Viable Configuration</text>

  <polygon points="480,322 614,322 614,308 646,340 614,372 614,358 480,358"
           fill="#D84315" opacity="0.9"/>
  <text x="547" y="344" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">Change in Execution Unit</text>

  <rect x="478" y="380" width="180" height="88" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="399" text-anchor="middle" font-size="9" fill="#2E75B6">
    What changed is
  </text>
  <text x="568" y="417" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#1F4E79">not the tools,</text>
  <text x="568" y="435" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#1F4E79">but what is treated</text>
  <text x="568" y="453" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#1F4E79">as one unit</text>

  <line x1="468" y1="106" x2="468" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>
  <line x1="668" y1="106" x2="668" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════
       RIGHT PANEL ─ Container
  ═══════════════════════════════════════ -->
  <rect x="668" y="66" width="432" height="40" fill="#00796B" rx="4"/>
  <text x="884" y="79" text-anchor="middle" font-size="10" fill="#E0F2F1">② Container</text>
  <text x="884" y="91" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">Execution Unit = Minimum Configuration</text>
  <text x="884" y="103" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">for the Application to Remain Viable</text>

  <rect x="668" y="106" width="432" height="534" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5"/>

  <!-- ─── 実行単位 点線ボックス（小さい） ─── -->
  <rect x="688" y="122" width="392" height="182" fill="none" stroke="#00796B"
        stroke-width="2" stroke-dasharray="7,4" rx="5"/>

  <!-- 実行単位バッジ（テール） -->
  <rect x="724" y="126" width="320" height="22" fill="#00796B" rx="11"/>
  <text x="884" y="141" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#FFFFFF">Execution Unit = Minimum Viable Configuration (this is one unit)</text>

  <!-- ── Container外枠 ── -->
  <rect x="698" y="150" width="372" height="148" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="2" rx="4"/>
  <!-- Container ヘッダー帯 -->
  <rect x="698" y="150" width="372" height="22" fill="#2E75B6" rx="4"/>
  <text x="884" y="166" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">Container</text>

  <!-- ── Application（Container内） ── -->
  <rect x="708" y="178" width="352" height="44" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="3"/>
  <text x="884" y="196" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#00796B">Application</text>
  <text x="884" y="213" text-anchor="middle" font-size="9" fill="#004D40">
    Business Logic / Execution Code
  </text>

  <!-- ── Libraries + Runtime（Container内） ── -->
  <rect x="708" y="228" width="352" height="62" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="3"/>
  <text x="884" y="246" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Libraries + Runtime</text>
  <text x="884" y="263" text-anchor="middle" font-size="9" fill="#BF360C">
    Only what is needed for the application to remain viable
  </text>
  <text x="884" y="280" text-anchor="middle" font-size="9" fill="#BF360C">
    No Guest OS — this is why it is lightweight
  </text>

  <!-- 実行単位サイズ注記 -->
  <rect x="708" y="314" width="352" height="28" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1" rx="3"/>
  <text x="884" y="333" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#00796B">Boot: Seconds / Size: Several MB (lightweight because OS is not included)</text>

  <!-- ── Containerエンジン層 ── -->
  <rect x="688" y="352" width="392" height="50" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="884" y="371" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">Container Engine (Docker, etc.)</text>
  <text x="884" y="389" text-anchor="middle" font-size="9" fill="#BF360C">
    Handles container start, stop, and management
  </text>

  <!-- ── ホストOS層 ── -->
  <rect x="688" y="408" width="392" height="50" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <rect x="688" y="408" width="392" height="20" fill="#2E75B6" rx="4"/>
  <text x="884" y="422" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">Host OS (Shared by All Containers)</text>
  <text x="884" y="447" text-anchor="middle" font-size="9" fill="#1F4E79">
    Kernel is shared — not included in the execution unit
  </text>

  <!-- ── Physical Server層 ── -->
  <rect x="688" y="464" width="392" height="52" fill="#546E7A" rx="4"/>
  <text x="884" y="486" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">Physical Server</text>
  <text x="884" y="504" text-anchor="middle" font-size="9" fill="#CFD8DC">
    CPU / Memory / Storage
  </text>

  <!-- 右パネル下部補足 -->
  <rect x="688" y="528" width="392" height="44" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="884" y="547" text-anchor="middle" font-size="10" fill="#2E75B6">
    Multiple containers share the Host OS kernel
  </text>
  <text x="884" y="564" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">→ Many containers can be started lightly on a single server</text>

  <!-- ═══════════════════════════════════════
       CAPTION
  ═══════════════════════════════════════ -->
  <rect x="20" y="652" width="4" height="78" fill="#D84315" rx="2"/>
  <text x="34" y="668" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">Change in Execution Unit:</tspan>
    <tspan>A VM treats "the entire environment including the OS" as its execution unit, so startup takes time and the size is large (several GB).</tspan>
  </text>
  <text x="34" y="688" text-anchor="start" font-size="11" fill="#1F4E79">
    A Container treats "the minimum configuration for the application to remain viable" as its execution unit. It shares the Host OS kernel and excludes the Guest OS, making it lightweight (several MB) and fast to start (seconds).
  </text>
  <text x="34" y="708" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">What changed is not the tools, but "what is treated as one unit."</tspan>
    <tspan>This shift made it possible to carry the application as “a unit independent of the execution location.”</tspan>
  </text>

</svg>
