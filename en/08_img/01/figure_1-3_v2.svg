<?xml version="1.0" encoding="UTF-8"?>
<!--
  図版 1-4  v1
  タイトル：CloudとOn-Premiseの前提の違い
  作成日：2026-06-09
  キャンバス：1120 × 740 px
  レイアウト：左(Cloud 448px) + 中央(軸 200px) + 右(On-premise 432px)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif">

  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#546E7A"/>
    </marker>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ===== TITLE BAR ===== -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="34" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#FFFFFF">Figure 1-3: The Difference in Assumptions Between Cloud and On-Premise</text>

  <!-- ══════════════════════════════════════════
       LEFT PANEL ── Cloud
       x=20–468, y=66–640
  ══════════════════════════════════════════ -->
  <rect x="20" y="66" width="448" height="40" fill="#2E75B6" rx="4"/>
  <text x="244" y="82" text-anchor="middle" font-size="10" fill="#BBDEFB">
    An Environment that Assumes Change
  </text>
  <text x="244" y="99" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#FFFFFF">Cloud</text>

  <rect x="20" y="106" width="448" height="534" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5"/>

  <!-- Core premise box -->
  <rect x="34" y="120" width="420" height="58" fill="#2E75B6" rx="5"/>
  <text x="244" y="140" text-anchor="middle" font-size="10" fill="#BBDEFB">
    Adopted Assumption
  </text>
  <text x="244" y="160" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#FFFFFF">Change, Expansion, Reconfiguration</text>

  <!-- Row 1: Nature ofEnvironment -->
  <rect x="34" y="194" width="420" height="86" fill="#FFFFFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <rect x="34" y="194" width="6" height="86" fill="#2E75B6" rx="2"/>
  <text x="254" y="215" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">The environment is not fixed</text>
  <text x="254" y="234" text-anchor="middle" font-size="9" fill="#1F4E79">
    Resources scale up and down according to demand.
  </text>
  <text x="254" y="251" text-anchor="middle" font-size="9" fill="#1F4E79">
    Configuration is treated under the assumption that it continues to change.
  </text>
  <text x="254" y="268" text-anchor="middle" font-size="9" fill="#546E7A">
    Rather than maintaining the environment, continue to achieve Viability while accepting change.
  </text>

  <!-- Row 2: Response扱い -->
  <rect x="34" y="296" width="420" height="86" fill="#FFFFFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <rect x="34" y="296" width="6" height="86" fill="#2E75B6" rx="2"/>
  <text x="254" y="317" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">Failure is assumed to occur</text>
  <text x="254" y="336" text-anchor="middle" font-size="9" fill="#1F4E79">
    Rather than repairing each individually,
  </text>
  <text x="254" y="353" text-anchor="middle" font-size="9" fill="#1F4E79">
    address by reconstituting in a different location.
  </text>
  <text x="254" y="370" text-anchor="middle" font-size="9" fill="#546E7A">
    Failure is not an exception — it is a designed-in assumption.
  </text>

  <!-- Row 3: 責任の所在 -->
  <rect x="34" y="398" width="420" height="86" fill="#FFFFFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <rect x="34" y="398" width="6" height="86" fill="#2E75B6" rx="2"/>
  <text x="254" y="419" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">Infrastructure management is handled by the provider</text>
  <text x="254" y="438" text-anchor="middle" font-size="9" fill="#1F4E79">
    Infrastructure management, restarts, and scaling are
  </text>
  <text x="254" y="455" text-anchor="middle" font-size="9" fill="#1F4E79">
    automatically handled by the mechanism.
  </text>
  <text x="254" y="472" text-anchor="middle" font-size="9" fill="#546E7A">
    Even without people making judgments each time, the whole continues to remain viable.
  </text>

  <!-- Left summary -->
  <rect x="34" y="500" width="420" height="46" fill="#2E75B6" rx="4"/>
  <text x="244" y="519" text-anchor="middle" font-size="10" fill="#BBDEFB">
    Because change is assumed,
  </text>
  <text x="244" y="539" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">A mechanism for continuously maintaining Viability is needed</text>

  <!-- LEFT divider -->
  <line x1="468" y1="106" x2="468" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════════
       CENTER PANEL ── 前提の軸
       x=468–668, y=66–640
  ══════════════════════════════════════════ -->
  <rect x="468" y="66" width="200" height="40" fill="#1F4E79" rx="4"/>
  <text x="568" y="88" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">How Assumptions are Set</text>

  <rect x="468" y="106" width="200" height="534" fill="#F5F7FA" stroke="#1F4E79"
        stroke-width="1.5"/>

  <!-- Central key message box -->
  <rect x="480" y="120" width="176" height="58" fill="#1F4E79" rx="5"/>
  <text x="568" y="142" text-anchor="middle" font-size="10" fill="#BBDEFB">
    Neither is correct
  </text>
  <text x="568" y="162" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">Assumptions are set differently</text>

  <!-- Row 1 center label -->
  <line x1="480" y1="194" x2="644" y2="194" stroke="#B0BEC5" stroke-width="1"/>
  <text x="568" y="234" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Nature of</text>
  <text x="568" y="252" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Environment</text>
  <line x1="480" y1="280" x2="644" y2="280" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Row 2 center label -->
  <text x="568" y="332" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Response</text>
  <text x="568" y="350" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">to Failure</text>
  <line x1="480" y1="382" x2="644" y2="382" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Row 3 center label -->
  <text x="568" y="432" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Way of</text>
  <text x="568" y="450" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Achieving Viability</text>
  <line x1="480" y1="484" x2="644" y2="484" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Center bottom message -->
  <rect x="474" y="496" width="188" height="76" fill="#1F4E79" rx="5"/>
  <text x="568" y="514" text-anchor="middle" font-size="9" fill="#BBDEFB">
    What you assume determines
  </text>
  <text x="568" y="531" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">The design question changes</text>
  <text x="568" y="548" text-anchor="middle" font-size="8" fill="#BBDEFB">
    how the way of achieving
  </text>
  <text x="568" y="563" text-anchor="middle" font-size="8" fill="#BBDEFB">
    Viability itself changes
  </text>

  <!-- RIGHT divider -->
  <line x1="668" y1="106" x2="668" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>

  <!-- ══════════════════════════════════════════
       RIGHT PANEL ── On-Premise
       x=668–1100, y=66–640
  ══════════════════════════════════════════ -->
  <rect x="668" y="66" width="432" height="40" fill="#546E7A" rx="4"/>
  <text x="884" y="82" text-anchor="middle" font-size="10" fill="#CFD8DC">
    An Environment that Assumes Control
  </text>
  <text x="884" y="99" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#FFFFFF">On-Premise</text>

  <rect x="668" y="106" width="432" height="534" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5"/>

  <!-- Core premise box -->
  <rect x="682" y="120" width="404" height="58" fill="#546E7A" rx="5"/>
  <text x="884" y="140" text-anchor="middle" font-size="10" fill="#CFD8DC">
    Adopted Assumption
  </text>
  <text x="884" y="160" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#FFFFFF">Fixed, Designed, Managed</text>

  <!-- Row 1: Nature ofEnvironment -->
  <rect x="682" y="194" width="404" height="86" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1.5" rx="4"/>
  <rect x="682" y="194" width="6" height="86" fill="#546E7A" rx="2"/>
  <text x="892" y="215" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Configuration is intentionally designed</text>
  <text x="892" y="234" text-anchor="middle" font-size="9" fill="#1F4E79">
    What to run where, and in what configuration,
  </text>
  <text x="892" y="251" text-anchor="middle" font-size="9" fill="#1F4E79">
    is designed by the team itself, which takes on the responsibility.
  </text>
  <text x="892" y="268" text-anchor="middle" font-size="9" fill="#546E7A">
    Changes are managed in a planned manner, and configuration is treated as stable.
  </text>

  <!-- Row 2: Response扱い -->
  <rect x="682" y="296" width="404" height="86" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1.5" rx="4"/>
  <rect x="682" y="296" width="6" height="86" fill="#546E7A" rx="2"/>
  <text x="892" y="317" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Failure is treated as an exception</text>
  <text x="892" y="336" text-anchor="middle" font-size="9" fill="#1F4E79">
    Repair the problem that occurred,
  </text>
  <text x="892" y="353" text-anchor="middle" font-size="9" fill="#1F4E79">
    and aim to return to the original state.
  </text>
  <text x="892" y="370" text-anchor="middle" font-size="9" fill="#546E7A">
    Maintaining configuration becomes the center of operations.
  </text>

  <!-- Row 3: 責任の所在 -->
  <rect x="682" y="398" width="404" height="86" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1.5" rx="4"/>
  <rect x="682" y="398" width="6" height="86" fill="#546E7A" rx="2"/>
  <text x="892" y="419" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#546E7A">Infrastructure management is handled by the team itself</text>
  <text x="892" y="438" text-anchor="middle" font-size="9" fill="#1F4E79">
    What to fix and what to change is
  </text>
  <text x="892" y="455" text-anchor="middle" font-size="9" fill="#1F4E79">
    left to the team's own judgment.
  </text>
  <text x="892" y="472" text-anchor="middle" font-size="9" fill="#546E7A">
    Designing and taking on the scope of control by oneself is the assumption.
  </text>

  <!-- Right summary -->
  <rect x="682" y="500" width="404" height="60" fill="#546E7A" rx="4"/>
  <text x="884" y="516" text-anchor="middle" font-size="10" fill="#CFD8DC">
    Because fixity is assumed,
  </text>
  <text x="884" y="533" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">Maintaining configuration and change management</text>
  <text x="884" y="551" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#FFFFFF">become the center of design</text>

  <!-- ═══════════════════════════════════
       CAPTION  y=652–730
  ═══════════════════════════════════ -->
  <rect x="20" y="652" width="4" height="78" fill="#2E75B6" rx="2"/>
  <text x="34" y="668" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">Difference in Assumptions:</tspan>
    <tspan>The difference between Cloud and On-Premise is not performance or cost. What is assumed to change, and what is assumed to be fixed — how assumptions are set differs.</tspan>
  </text>
  <text x="34" y="688" text-anchor="start" font-size="11" fill="#1F4E79">
    When change is assumed, a mechanism for continuously maintaining Viability is needed. When fixity is assumed, configuration design and change management become important.
  </text>
  <text x="34" y="708" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">Neither is correct. When assumptions change, the very way of achieving Viability changes.</tspan>
  </text>

</svg>
