<?xml version="1.0" encoding="UTF-8"?>
<!--
  図版 3-4  v1
  タイトル：遅延が上流へ伝播する
  レイアウト：垂直伝播図（上=上位サービス、下=障害源）
  キャンバス：1120 × 740 px
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif">

  <defs>
    <marker id="arr-req" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E75B6"/>
    </marker>
    <marker id="arr-prop" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ===== TITLE BAR ===== -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="34" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#FFFFFF">図3-4　遅延が上流へ伝播する</text>

  <!-- ===== ZONE LABELS (y=64-94) ===== -->
  <rect x="20" y="64" width="240" height="28" fill="#2E75B6" rx="4"/>
  <text x="140" y="83" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">呼び出しの方向（上 → 下）</text>

  <rect x="860" y="64" width="240" height="28" fill="#C62828" rx="4"/>
  <text x="980" y="83" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">障害の伝播（下 → 上）</text>

  <!-- Side guide lines -->
  <line x1="140" y1="94" x2="140" y2="562"
        stroke="#2E75B6" stroke-width="1.2" stroke-dasharray="5,4"
        marker-end="url(#arr-req)"/>
  <line x1="980" y1="562" x2="980" y2="94"
        stroke="#C62828" stroke-width="1.2" stroke-dasharray="5,4"
        marker-end="url(#arr-prop)"/>

  <!-- ══════════════════════════════════════════
       SERVICE A  (上位サービス)  y=100-185
  ══════════════════════════════════════════ -->
  <rect x="280" y="100" width="560" height="85" fill="#FFF3E0"
        stroke="#D84315" stroke-width="2" rx="5"/>
  <rect x="280" y="100" width="560" height="26" fill="#D84315" rx="5"/>
  <rect x="280" y="114" width="560" height="12" fill="#D84315"/>
  <text x="420" y="118" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">呼び出し元サービス</text>
  <text x="680" y="118" text-anchor="middle" font-size="9"
        fill="#FFEBEE">（Service A）</text>
  <!-- State badge -->
  <rect x="648" y="145" width="182" height="20" fill="#D84315" rx="3"/>
  <text x="739" y="159" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#FFFFFF">状態：待機中</text>
  <!-- Description -->
  <text x="440" y="150" text-anchor="middle" font-size="8.5" fill="#BF360C">
    下位からの遅延が波及し、
  </text>
  <text x="440" y="163" text-anchor="middle" font-size="8.5" fill="#BF360C">
    処理待ちリクエストが蓄積し始める。
  </text>
  <text x="440" y="176" text-anchor="middle" font-size="8" fill="#546E7A">
    スレッドが消費され、応答が遅れ始める。
  </text>

  <!-- ── Arrow Zone 1  y=185-225 ── -->
  <!-- Request (down) -->
  <line x1="430" y1="188" x2="430" y2="221"
        stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arr-req)"/>
  <text x="368" y="208" text-anchor="end" font-size="8" fill="#2E75B6">呼び出し</text>
  <!-- Propagation (up) -->
  <line x1="690" y1="222" x2="690" y2="189"
        stroke="#C62828" stroke-width="1.5" marker-end="url(#arr-prop)"/>
  <text x="752" y="208" text-anchor="start" font-size="8" fill="#C62828">影響が伝わる</text>

  <!-- ══════════════════════════════════════════
       SERVICE B  (中間サービス)  y=225-310
  ══════════════════════════════════════════ -->
  <rect x="280" y="225" width="560" height="85" fill="#FFF3E0"
        stroke="#D84315" stroke-width="2" rx="5"/>
  <rect x="280" y="225" width="560" height="26" fill="#D84315" rx="5"/>
  <rect x="280" y="239" width="560" height="12" fill="#D84315"/>
  <text x="420" y="243" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">中間サービス</text>
  <text x="680" y="243" text-anchor="middle" font-size="9"
        fill="#FFEBEE">（Service B）</text>
  <!-- State badge -->
  <rect x="648" y="270" width="182" height="20" fill="#D84315" rx="3"/>
  <text x="739" y="284" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#FFFFFF">状態：応答遅延</text>
  <!-- Description -->
  <text x="440" y="275" text-anchor="middle" font-size="8.5" fill="#BF360C">
    呼び出し先の応答待ちで
  </text>
  <text x="440" y="288" text-anchor="middle" font-size="8.5" fill="#BF360C">
    利用可能なスレッドがすべて埋まる。
  </text>
  <text x="440" y="301" text-anchor="middle" font-size="8" fill="#546E7A">
    新たなリクエストを受け付けられなくなる。
  </text>

  <!-- ── Arrow Zone 2  y=310-350 ── -->
  <line x1="430" y1="313" x2="430" y2="346"
        stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arr-req)"/>
  <text x="368" y="333" text-anchor="end" font-size="8" fill="#2E75B6">呼び出し</text>
  <line x1="690" y1="347" x2="690" y2="314"
        stroke="#C62828" stroke-width="1.5" marker-end="url(#arr-prop)"/>
  <text x="752" y="333" text-anchor="start" font-size="8" fill="#C62828">影響が伝わる</text>

  <!-- ══════════════════════════════════════════
       SERVICE C  (呼び出し先サービス)  y=350-435
  ══════════════════════════════════════════ -->
  <rect x="280" y="350" width="560" height="85" fill="#FFEBEE"
        stroke="#C62828" stroke-width="2" rx="5"/>
  <rect x="280" y="350" width="560" height="26" fill="#C62828" rx="5"/>
  <rect x="280" y="364" width="560" height="12" fill="#C62828"/>
  <text x="420" y="368" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">呼び出し先サービス</text>
  <text x="680" y="368" text-anchor="middle" font-size="9"
        fill="#FFEBEE">（Service C）</text>
  <!-- State badge -->
  <rect x="648" y="395" width="182" height="20" fill="#C62828" rx="3"/>
  <text x="739" y="409" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#FFFFFF">状態：処理詰まり</text>
  <!-- Description -->
  <text x="440" y="400" text-anchor="middle" font-size="8.5" fill="#C62828">
    外部への応答を待ち続け、
  </text>
  <text x="440" y="413" text-anchor="middle" font-size="8.5" fill="#C62828">
    処理がそこで止まり続ける。
  </text>
  <text x="440" y="426" text-anchor="middle" font-size="8" fill="#546E7A">
    タイムアウトまで待つことで、上位への影響が始まる。
  </text>

  <!-- ── Arrow Zone 3  y=435-475 ── -->
  <line x1="430" y1="438" x2="430" y2="471"
        stroke="#2E75B6" stroke-width="1.5" marker-end="url(#arr-req)"/>
  <text x="368" y="458" text-anchor="end" font-size="8" fill="#2E75B6">クエリ</text>
  <line x1="690" y1="472" x2="690" y2="439"
        stroke="#C62828" stroke-width="1.5" marker-end="url(#arr-prop)"/>
  <text x="752" y="458" text-anchor="start" font-size="8" fill="#C62828">応答遅延</text>

  <!-- ══════════════════════════════════════════
       EXTERNAL DB / API  (障害源)  y=475-560
  ══════════════════════════════════════════ -->
  <rect x="280" y="475" width="560" height="85" fill="#C62828"
        stroke="#BF360C" stroke-width="2" rx="5"/>
  <rect x="280" y="475" width="560" height="26" fill="#BF360C" rx="5"/>
  <rect x="280" y="489" width="560" height="12" fill="#BF360C"/>
  <text x="420" y="493" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">外部依存（DB / API）</text>
  <text x="700" y="493" text-anchor="middle" font-size="9"
        fill="#FFEBEE">▶ 障害発生源</text>
  <!-- State badge (white on dark) -->
  <rect x="648" y="520" width="182" height="20" fill="#FFFFFF" rx="3"/>
  <text x="739" y="534" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#C62828">状態：処理停止</text>
  <!-- Description -->
  <text x="440" y="525" text-anchor="middle" font-size="8.5" fill="#FFEBEE">
    応答が極端に遅くなり、
  </text>
  <text x="440" y="538" text-anchor="middle" font-size="8.5" fill="#FFEBEE">
    接続しているサービスをすべて待ち状態にする。
  </text>
  <text x="440" y="551" text-anchor="middle" font-size="8" fill="#FFF3E0">
    これが遅延連鎖の根本原因となる。
  </text>

  <!-- ══════════════════════════════════════════
       KEY MESSAGES  y=578-638
  ══════════════════════════════════════════ -->

  <!-- Message 1 -->
  <rect x="20" y="578" width="346" height="60" fill="#1F4E79" rx="5"/>
  <rect x="20" y="578" width="346" height="22" fill="#2E75B6" rx="5"/>
  <rect x="20" y="588" width="346" height="10" fill="#2E75B6"/>
  <text x="193" y="594" text-anchor="middle" font-size="9" fill="#BBDEFB">遅延の連鎖</text>
  <text x="193" y="616" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">1箇所の遅延が全体に波及する</text>
  <text x="193" y="632" text-anchor="middle" font-size="8.5" fill="#DDEEFF">
    タイムアウト待ちが連鎖し、上位まで止まる。
  </text>

  <!-- Message 2 -->
  <rect x="387" y="578" width="346" height="60" fill="#1F4E79" rx="5"/>
  <rect x="387" y="578" width="346" height="22" fill="#D84315" rx="5"/>
  <rect x="387" y="588" width="346" height="10" fill="#D84315"/>
  <text x="560" y="594" text-anchor="middle" font-size="9" fill="#FFF3E0">スレッド枯渇</text>
  <text x="560" y="616" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">応答待ちがスレッドを占有し続ける</text>
  <text x="560" y="632" text-anchor="middle" font-size="8.5" fill="#FFEBEE">
    処理能力が奪われ、新たな要求を受け付けられなくなる。
  </text>

  <!-- Message 3 -->
  <rect x="754" y="578" width="346" height="60" fill="#1F4E79" rx="5"/>
  <rect x="754" y="578" width="346" height="22" fill="#C62828" rx="5"/>
  <rect x="754" y="588" width="346" height="10" fill="#C62828"/>
  <text x="927" y="594" text-anchor="middle" font-size="9" fill="#FFEBEE">根本原因</text>
  <text x="927" y="616" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#FFFFFF">原因は上位では見えにくくなる</text>
  <text x="927" y="632" text-anchor="middle" font-size="8.5" fill="#FFEBEE">
    障害は下位で起き、症状は上位に現れる。
  </text>

  <!-- ══════════════════════════════════════════
       CAPTION  y=650-718
  ══════════════════════════════════════════ -->
  <rect x="20" y="650" width="4" height="68" fill="#C62828" rx="2"/>
  <text x="34" y="666" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">遅延・障害の伝播：</tspan>
    <tspan>下位サービスの応答が遅れると、それを待つ上位サービスは処理を止めて待ち続ける。やがてスレッドが埋まり、新たな要求を受け付けられなくなる。</tspan>
  </text>
  <text x="34" y="686" text-anchor="start" font-size="11" fill="#1F4E79">
    スレッドが枯渇した上位サービスは新たなリクエストを受け付けられなくなり、さらに上位へと障害が伝わっていく。
  </text>
  <text x="34" y="706" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">遅延は下位で始まり、症状は上位に現れる。原因と症状が離れているため、全体への影響に気づきにくい。</tspan>
  </text>

</svg>
